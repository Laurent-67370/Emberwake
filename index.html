<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sunkeeper</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#07060c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg:#07060c; --fg:#d9cfe8; --dim:#7d7290; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font:14px/1.4 system-ui, sans-serif; overflow:hidden; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas#screen { image-rendering:pixelated; image-rendering:crisp-edges;
    background:#000; box-shadow:0 0 60px #000; touch-action:none; }
  #help { position:fixed; left:0; right:0; bottom:6px; text-align:center; color:var(--dim);
    font-size:12px; pointer-events:none; padding:0 16px; }
  #help b { color:var(--fg); font-weight:600; }
</style>
</head>
<body>
<div id="wrap"><canvas id="screen" width="256" height="224"></canvas></div>
<div id="help"><b>Flèches</b> bouger · <b>Z/Espace</b> sauter · <b>X</b> épée · <b>C</b> dash · <b>V</b> tir solaire (maintenir) · <b>Entrée</b> start/pause · <b>F</b> plein écran · <b>M</b> son · Manette OK</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
