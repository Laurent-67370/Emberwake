name: Android APK

on:
  push:
    branches: ['**']
    paths: ['android/**', 'src/**', 'index.html', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APKs
        working-directory: android
        run: |
          chmod +x gradlew
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ./gradlew --no-daemon assembleDebug assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sunkeeper-apk
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
      - name: Publish the APK as a direct download (release "apk")
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk sunkeeper.apk
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk sunkeeper.apk --target "$GITHUB_SHA" \
            --title "Sunkeeper — APK Android" \
            --notes "Téléchargez sunkeeper.apk sur votre téléphone, ouvrez-le et autorisez l'installation depuis cette source. Version construite depuis ${GITHUB_SHA::7}."
